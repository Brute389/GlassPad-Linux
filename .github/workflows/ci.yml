name: tests

# Pinned rather than `-latest`, on purpose: a runner image that moves under the suite is
# how a green pipeline turns into a red one with no commit in between, and the failure you
# then debug is GTK's, not yours. Bump it deliberately, in a commit that says so.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The suites must pass with no display at all. Anything that needs one reports `skipped`
  # and the tally shows the skip -- a suite that silently stops asserting things is worse
  # than one that is absent, and this whole project is a hunt for exactly that bug.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  suite:
    name: Suite (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-gtk-4.0 squashfs-tools desktop-file-utils
          # libgtk4-layer-shell is the one dependency a distribution may simply not carry.
          # GlassPad resolves it at runtime and says which rule matched, and the suites
          # that need it report skips rather than failures -- so its absence here is a
          # narrower test run, not a broken one. Said out loud because a CI that quietly
          # tests less than it claims is the failure mode this repository keeps hitting.
          if ! sudo apt-get install -y --no-install-recommends libgtk4-layer-shell0; then
            echo "::warning::libgtk4-layer-shell is not packaged for this Ubuntu release; the layer suites will skip and the artefact cannot be displayed here"
          fi

      - name: What this runner actually has
        run: |
          python3 - <<'PY'
          import importlib.util, os, shutil, sys
          sys.path.insert(0, ".")
          print(f"python      : {sys.version.split()[0]}")
          print(f"gi          : {'yes' if importlib.util.find_spec('gi') else 'MISSING'}")
          for probe in ("libgtk4-layer-shell.so.0", "udevadm", "mksquashfs",
                        "desktop-file-validate"):
              found = shutil.which(probe) or "not found"
              print(f"{probe:<22}: {found}")
          from glasspad import bundle
          lib, why = bundle.layer_shell_path()
          print(f"resolver    : {lib or 'NOT FOUND'} ({why})")
          print(f"WAYLAND_DISPLAY: {os.environ.get('WAYLAND_DISPLAY', 'unset')}")
          PY

      - name: Run every suite
        # --no-live: the in-app self-test maps a real fullscreen overlay, and there is no
        # compositor here. --no-artifacts: dist/ belongs to the job below; the gate in
        # tools/make_appimage.sh uses the same pair for the same reason.
        run: python3 tools/check_all.py --no-live --no-artifacts -v

      - name: Record what was and was not tested
        if: always()
        run: |
          {
            echo "## Suite (headless)"
            echo ""
            echo '```'
            python3 tools/check_all.py --no-live --no-artifacts 2>&1 | tail -n 6
            echo '```'
            echo ""
            echo "No Wayland compositor on this runner: the live self-test and the"
            echo "display-dependent tests are **skipped**, not passed. Stacking,"
            echo "touch-through and what the overlay looks like over a fullscreen game"
            echo "are verified by hand, on real hardware, and CI cannot pretend otherwise."
          } >> "$GITHUB_STEP_SUMMARY"

  artifact:
    name: Build and open the AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-gtk-4.0 squashfs-tools desktop-file-utils
          sudo apt-get install -y --no-install-recommends libgtk4-layer-shell0 || true

      - name: Build
        # The builder runs the suite before packing and refuses to package a red tree, and
        # it executes the staged AppDir before mksquashfs is allowed to touch it -- the
        # artefact is tested as a program, not only as a file.
        run: bash tools/make_appimage.sh

      - name: Open the image that came out
        run: python3 tools/check_all.py --no-live -k appimage -v

      - name: Provenance
        run: |
          cat dist/BUILD-INFO.txt
          sha256sum dist/GlassPad-*.AppImage | tee dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: glasspad-appimage
          path: |
            dist/GlassPad-*.AppImage
            dist/GlassPad-*.AppImage.sha256
            dist/BUILD-INFO.txt
          if-no-files-found: error
