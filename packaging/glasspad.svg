<?xml version="1.0" encoding="UTF-8"?>
<!-- GlassPad: a tablet seen from the front with a gamepad drawn on its screen.
     Colours are the overlay's own ice-blue accent (#00E5FF) on the app's dark fill. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
  </defs>

  <!-- tablet body -->
  <rect x="16" y="40" width="224" height="176" rx="18" fill="#2a3038" stroke="#3d4650" stroke-width="3"/>
  <rect x="30" y="54" width="196" height="148" rx="10" fill="url(#screen)"/>

  <!-- d-pad: the soft cool variant the overlay actually paints -->
  <g stroke="#00E5FF" stroke-width="3" fill="rgba(0,229,255,0.18)" stroke-opacity="0.75">
    <path d="M62 102 h20 v-20 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 z"/>
  </g>

  <!-- left stick -->
  <circle cx="82" cy="164" r="24" fill="rgba(0,229,255,0.10)" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="82" cy="164" r="11" fill="rgba(0,229,255,0.55)"/>

  <!-- face buttons -->
  <g fill="rgba(0,229,255,0.20)" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="3">
    <circle cx="196" cy="112" r="15"/>
    <circle cx="172" cy="136" r="15"/>
    <circle cx="220" cy="136" r="15"/>
    <circle cx="196" cy="160" r="15"/>
  </g>

  <!-- right stick, dimmer: it is there but it is not the point -->
  <circle cx="150" cy="176" r="17" fill="rgba(0,229,255,0.06)" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="3"/>

  <!-- hub pill, the always-on-top control -->
  <rect x="104" y="66" width="48" height="16" rx="8" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
</svg>
